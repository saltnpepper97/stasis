[package]
name = "stasis"
version = "1.7.0"
edition = "2024"
rust-version = "1.89"
authors = ["Dustin Pilgrim <dustin.pilgrim1997@gmail.com>"]
description = "A modern Wayland idle manager that knows when to step back."
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/saltnpepper97/stasis"
keywords = ["wayland", "idle", "manager", "rust", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]
exclude = ["/.github", "/target", "/.idea", "/.vscode", "Cargo.lock"]

[profile.dev]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
evdev = { version = "0.13.2", features = ["tokio"] }
eventline = "0.10.0"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ksni = "0.3.6"
lib_game_detector = { version = "=0.0.39", default-features = false, features = ["bundled_sqlite"] }
procfs = { version = "0.18.0", default-features = false }
regex = "1.13.1"
rune-cfg = "0.8.0"
rustix = { version = "1.1.5", default-features = false, features = ["event", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable", "staging"] }
zbus = { version = "6.0", features = ["tokio"] }
